<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FoodBridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main style="max-width: 460px; margin: 50px auto; padding: 24px;">
        <h1>Welcome back</h1>
        <p>Log in to your FoodBridge account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p role="status">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" class="form-card">
            <label>
                Email
                <input type="email" name="email" autocomplete="email" required>
            </label>

            <label>
                Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>

            <button type="submit" class="primary-button">Log in</button>
        </form>

        <p>New to FoodBridge? <a href="{{ url_for('register') }}">Create an account</a></p>
        <p><a href="{{ url_for('home') }}">Return to FoodBridge</a></p>
    </main>
</body>
</html>
